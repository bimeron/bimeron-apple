name: macOS UI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Only manual runs on main use the personal Mac.
    runs-on: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && fromJSON('["self-hosted", "macOS", "ARM64"]') || 'macos-15' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check acceptance fixtures
        run: python3 fixtures/acceptance/check.py
      - name: Test
        run: swift test
      - name: Build app
        run: sh scripts/build-app.sh
      - name: Check bundle
        run: test -x dist/Bimeron.app/Contents/MacOS/Bimeron
