name: macOS UI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Allowlisted PR head SHA (PRs 15, 18, 19, 20, 21 respectively)'
        required: true
        type: choice
        options:
          - 96d19631743070303887481617eb4f73249308f2
          - b896fd9e7ce7b95524b98133ce179bf0ed24e50b
          - 74e6933b2c57d9d44c65d560b366f9eba4be3ce3
          - 70e7f218c62d8ebcf04813e59d4fac3ecd5e95db
          - ace5610e9e3817fb9238f256915898f95ab38f48

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    steps:
      - name: Validate manual commit
        if: github.event_name == 'workflow_dispatch'
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          case "$COMMIT" in
            96d19631743070303887481617eb4f73249308f2|b896fd9e7ce7b95524b98133ce179bf0ed24e50b|74e6933b2c57d9d44c65d560b366f9eba4be3ce3|70e7f218c62d8ebcf04813e59d4fac3ecd5e95db|ace5610e9e3817fb9238f256915898f95ab38f48) ;;
            *) echo 'Commit is not in the temporary PR allowlist'; exit 1 ;;
          esac
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || inputs.commit || github.sha }}
      - name: Record build provenance
        run: |
          git rev-parse HEAD
          uname -m
          xcodebuild -version
          swift --version
      - name: Check acceptance fixtures
        run: python3 fixtures/acceptance/check.py
      - name: Test bundle checker
        run: python3 scripts/test-check-app-bundle.py
      - name: Test
        run: swift test
      - uses: actions/checkout@v4
        with:
          repository: bimeron/bimeron-core
          ref: baf3d0e1b061b6f1210b0d9aa040c9512fe646a1
          path: .core-source
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
          cache: false
      - name: Cache pinned Core dependencies
        working-directory: .core-source
        run: go mod download
      - name: Build app with pinned development Core
        env:
          BIMERON_CORE_SOURCE: ${{ github.workspace }}/.core-source
        run: sh scripts/build-app.sh
      - name: Check bundle
        run: |
          test -x dist/Bimeron.app/Contents/MacOS/Bimeron
          python3 scripts/check-app-bundle.py dist/Bimeron.app
